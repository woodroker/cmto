name: build-css
on:
  push:
    branches: [main]
    paths: ['src/**', 'styles/**', 'tailwind.config.js', 'template/**']
permissions:
  contents: write
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add css/app.css
          git diff --cached --quiet || (git commit -m "build: css [skip ci]" && git push)
