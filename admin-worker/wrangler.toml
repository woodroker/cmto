name = "cmto-admin"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Dashboard statis ada di ./public (diakses di /)
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# ID akun Instagram Business @udcmto (bukan rahasia)
IG_USER_ID = "17841406106427783"
# GANTI: daftar chat ID Telegram asli yang boleh memakai bot, dipisah koma
# (ambil dari https://api.telegram.org/bot<TOKEN>/getUpdates setelah kirim pesan ke bot)
ADMIN_CHAT_IDS = "123456789"

# GANTI: URL blog Blogger kamu (dengan domain custom kalau sudah pasang),
# dipakai untuk bikin link "Lihat & beli" di tiap postingan produk.
BLOG_URL = "https://ganti-dengan-domain-blog-kamu.com"
# GANTI: Blog ID Blogger kamu (bukan rahasia). Cara lihat: buka Blogger ->
# pilih blog -> buka halaman mana saja di dashboard -> lihat URL-nya,
# formatnya blogger.com/blog/posts/<BLOG_ID> atau blogger.com/blog/.../<BLOG_ID>
BLOGGER_BLOG_ID = "GANTI_DENGAN_BLOG_ID"

# Cek postingan Instagram baru tiap 30 menit
[triggers]
crons = ["*/30 * * * *"]

# GANTI: buat dulu dengan `npx wrangler kv namespace create SEEN`, lalu isi id di bawah
[[kv_namespaces]]
binding = "SEEN"
id = "GANTI_DENGAN_ID_KV"

# Secret tambahan yang dipakai syncInstagram() tapi belum didaftarkan di sini —
# jangan ditaruh di [vars] karena ini rahasia (long-lived token Graph API):
#   npx wrangler secret put IG_ACCESS_TOKEN
# Token ini dari Meta/Facebook Graph API untuk akun Instagram Business @udcmto
# (System User token atau Page access token yang sudah ditukar jadi long-lived token).
# Tanpa secret ini, cron syncInstagram() akan gagal dan admin akan dapat notifikasi
# "⚠️ Sync Instagram gagal".

# Secret untuk Blogger API (1 postingan otomatis per karya, lihat
# bloggerUpsert() di src/index.js). Kalau belum disetel, fitur ini otomatis
# dilewati (diam, tidak error) — /tambah, /ubah, dll tetap jalan normal.
#   npx wrangler secret put BLOGGER_CLIENT_ID
#   npx wrangler secret put BLOGGER_CLIENT_SECRET
#   npx wrangler secret put BLOGGER_REFRESH_TOKEN
# Cara dapatkan ketiganya: lihat panduan di README.md bagian "Sinkron ke Blogger".
