name = "cmto-admin"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Dashboard statis ada di ./public (diakses di /)
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# ID akun Instagram Business @udcmto (bukan rahasia)
IG_USER_ID = "17841406106427783"

# Chat ID Telegram yang boleh memakai bot, dipisah koma (bukan rahasia)
ADMIN_CHAT_IDS = "8425764136"

# URL blog Blogger, dipakai untuk link "Lihat & beli" di tiap postingan produk
BLOG_URL = "https://www.cmto.my.id"

# URL Web app Apps Script yang berakhiran /exec (lihat langkah deploy Apps Script)
# GANTI nilai di bawah sebelum deploy. Jangan biarkan teks placeholder.
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQw6arQ9gsUKYTpHcMEU0bHpjWgjjKcH3v1dldze_hlL3uQVvLmYe-YqbXj0BAWs0Ong/exec"

# Cek postingan Instagram baru tiap 30 menit
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "SEEN"
id = "115773269d454bdc98c404bea6a1d59f"

# Secret (jangan ditaruh di [vars]):
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put IG_ACCESS_TOKEN
#   npx wrangler secret put APPS_SCRIPT_SECRET