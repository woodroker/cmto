name = "cmto-admin"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Dashboard statis ada di ./public (diakses di /)
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# ID akun Instagram Business @udcmto (bukan rahasia)
IG_USER_ID = "17841406106427783"
# GANTI: daftar chat ID Telegram asli yang boleh memakai bot, dipisah koma
# (ambil dari https://api.telegram.org/bot<TOKEN>/getUpdates setelah kirim pesan ke bot)
ADMIN_CHAT_IDS = "123456789"

# Cek postingan Instagram baru tiap 30 menit
[triggers]
crons = ["*/30 * * * *"]

# GANTI: buat dulu dengan `npx wrangler kv namespace create SEEN`, lalu isi id di bawah
[[kv_namespaces]]
binding = "SEEN"
id = "GANTI_DENGAN_ID_KV"

# Secret tambahan yang dipakai syncInstagram() tapi belum didaftarkan di sini —
# jangan ditaruh di [vars] karena ini rahasia (long-lived token Graph API):
#   npx wrangler secret put IG_ACCESS_TOKEN
# Token ini dari Meta/Facebook Graph API untuk akun Instagram Business @udcmto
# (System User token atau Page access token yang sudah ditukar jadi long-lived token).
# Tanpa secret ini, cron syncInstagram() akan gagal dan admin akan dapat notifikasi
# "⚠️ Sync Instagram gagal".
